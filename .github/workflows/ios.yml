name: iOS build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        shell: bash
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          simulator_id="$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1]))['devices']
          for runtime, items in devices.items():
              if '.iOS-' in runtime:
                  for device in items:
                      if device['isAvailable'] and device['name'].startswith('iPhone'):
                          print(device['udid'])
                          sys.exit(0)
          sys.exit('No available iPhone simulator')
          PY
          )"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Build and run XCTest
        run: |
          xcodebuild test \
            -project Concieasy/Concieasy.xcodeproj \
            -scheme Concieasy \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/Concieasy.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Concieasy-XCTest-results
          path: ${{ runner.temp }}/Concieasy.xcresult
          if-no-files-found: ignore
